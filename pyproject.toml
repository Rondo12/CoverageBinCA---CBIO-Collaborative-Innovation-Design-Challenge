# Simple: this file turns the binopt/ folder into an installable package, so any notebook
# or test can write `import binopt`.
# Technical: `pip install -e .` does an "editable" install. Python imports straight from
# this folder, so code changes take effect without reinstalling.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "binopt"
version = "0.1.0"
description = "Fresno State bin-placement pilot: campus data, maps, and the coverage model's inputs"
requires-python = ">=3.11"
# Only PuLP is pinned here, so `pip install -e .` in Colab installs a version our model is tested
# on instead of whatever Colab ships (Colab moved to PuLP 4.0, which changed how variables are made).
dependencies = ["pulp>=2.7,<4"]

[tool.setuptools]
packages = ["binopt"]
